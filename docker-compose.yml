# MetaBot.OS — despliegue de producción (VPS)
#
#   cp .env.example .env   (completar API keys, BRIDGE_SECRET, ADMIN_TOKEN)
#   docker compose up -d --build
#
# Con DOMAIN definido en .env, Caddy emite HTTPS automático (Let's Encrypt).
# Sin DOMAIN, todo queda en http://IP (Meta exige HTTPS para su webhook).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: metabot
      POSTGRES_USER: metabot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?definí POSTGRES_PASSWORD en .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metabot -d metabot"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    restart: unless-stopped
    env_file:
      - .env
      # La clave de OpenAI del CFO vive aparte. `required: false` porque el
      # archivo está en .gitignore: existe en la máquina de desarrollo y NO
      # llega al servidor por git. Sin esto, un `docker compose up` en el VPS
      # falla por un archivo que nunca va a estar ahí.
      #
      # En producción la variable va en el .env del servidor. Solo el backend
      # la recibe: ni el bridge, ni la base, ni el panel — al frontend no
      # puede llegar nunca, terminaría en el bundle del navegador.
      - path: ./GPTAPI.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://metabot:${POSTGRES_PASSWORD}@db:5432/metabot
      BRIDGE_URL: http://bridge:3001
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - data:/data
      - media:/app/media
    expose:
      - "8000"

  bridge:
    build: ./bridge
    restart: unless-stopped
    environment:
      BACKEND_URL: http://backend:8000
      BRIDGE_SECRET: ${BRIDGE_SECRET}
    volumes:
      - sessions:/bridge/sessions
    expose:
      - "3001"

  # n8n: integraciones LATERALES únicamente (Sheets, Drive, correo, ERP del
  # cliente, avisos internos). Lo que no se puede perder —citas,
  # recordatorios, tomas de medicación, cobros— vive en la cola durable del
  # backend, no acá: un workflow visual no da garantías de reintento ni de
  # idempotencia, y ya nos costó caro aprender esa diferencia.
  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: ${DOMAIN}
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/n8n/
      N8N_PATH: /n8n/
      GENERIC_TIMEZONE: America/Asuncion
      TZ: America/Asuncion
      # Sin autenticación propia n8n queda abierto a Internet: el editor
      # permite ejecutar comandos, así que esto NO es opcional.
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:?definí N8N_USER en .env}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?definí N8N_PASSWORD en .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?definí N8N_ENCRYPTION_KEY en .env}
      # Para que los workflows lleguen al backend por la red interna.
      METABOT_URL: http://backend:8000
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-:80}
      # Hash bcrypt de la clave de n8n. Caddy hace la autenticación porque
      # n8n ya no respeta N8N_BASIC_AUTH_ACTIVE. Con `:?` el despliegue falla
      # ruidosamente si falta: sin el hash, Caddy no arranca y el sitio entero
      # se cae, así que es mejor enterarse acá que en producción.
      N8N_AUTH_HASH: ${N8N_AUTH_HASH:?definí N8N_AUTH_HASH en .env (caddy hash-password)}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:      # legado SQLite (se conserva para respaldo tras la migración)
  media:
  sessions:
  n8n_data:
  caddy_data:
  caddy_config:
